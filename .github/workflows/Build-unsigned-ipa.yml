
name: Build unsigned WOLFJAIL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project WOLFJAIL.xcodeproj \
            -scheme WOLFJAIL \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WOLFJAIL.app Payload/
          zip -r WOLFJAIL-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WOLFJAIL-unsigned-IPA
          path: WOLFJAIL-unsigned.ipa
