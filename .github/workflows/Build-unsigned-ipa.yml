
name: Build WOLFJAIL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        run: |
          find . -name "*.xcodeproj" -print
          PROJECT=$(find . -name "WOLFJAIL.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "WOLFJAIL.xcodeproj was not found"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme WOLFJAIL \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package
        run: |
          APP="build/Build/Products/Release-iphoneos/WOLFJAIL.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r WOLFJAIL-unsigned.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WOLFJAIL-unsigned-IPA
          path: WOLFJAIL-unsigned.ipa
